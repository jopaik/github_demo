---
- name: Provision GitHub Repository and Push Initial Commit
  hosts: localhost
  gather_facts: false
  vars:
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    github_user: "{{ lookup('ansible.builtin.env', 'GITHUB_USER') | default('x-access-token', true) }}"
    repo_owner: "jopaik"
    repo_name: "aap-automation-github-demo"
    local_repo_path: "/tmp/{{ repo_name }}"

  tasks:
    - name: Ensure GitHub repository exists
      ansible.builtin.uri:
        url: "https://api.github.com/user/repos"
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          name: "{{ repo_name }}"
          description: "Automated repo created via Ansible Automation Platform"
          private: false
        status_code: [201, 422]
      no_log: true

    - name: Clean existing local temporary directory if present
      ansible.builtin.file:
        path: "{{ local_repo_path }}"
        state: absent

    - name: Create local repo directory
      ansible.builtin.file:
        path: "{{ local_repo_path }}"
        state: directory
        mode: '0755'

    - name: Initialize Git repository locally
      ansible.builtin.command:
        cmd: git init -b main
        chdir: "{{ local_repo_path }}"

    - name: Configure remote origin with token auth
      ansible.builtin.command:
        cmd: "git remote add origin https://{{ github_user }}:{{ github_token }}@github.com/{{ repo_owner }}/{{ repo_name }}.git"
        chdir: "{{ local_repo_path }}"
      no_log: true

    - name: Configure local Git user name
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.name
        value: "AAP Automation Bot"
        scope: local

    - name: Configure local Git user email
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.email
        value: "aap-bot@example.com"
        scope: local

    - name: Create initial README file
      ansible.builtin.copy:
        dest: "{{ local_repo_path }}/README.md"
        content: |
          # AAP Automation Demo
          This repository was provisioned and initialized via Ansible Automation Platform.
        mode: '0644'

    - name: Stage files
      ansible.builtin.command:
        cmd: git add README.md
        chdir: "{{ local_repo_path }}"

    - name: Create initial commit
      ansible.builtin.command:
        cmd: git commit -m "Initial commit via Ansible Automation Platform"
        chdir: "{{ local_repo_path }}"

    - name: Push initial commit to main branch
      ansible.builtin.command:
        cmd: git push -u origin main
        chdir: "{{ local_repo_path }}"
      no_log: true