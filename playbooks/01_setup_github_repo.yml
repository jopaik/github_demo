---
- name: Provision GitHub Repository and Workspace via ansible.scm
  hosts: localhost
  gather_facts: false
  vars:
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    github_user: "{{ lookup('ansible.builtin.env', 'GITHUB_USER') | default('x-access-token', true) }}"
    repo_owner: "jopaik"
    repo_name: "aap-automation-github-demo"
    local_repo_path: "/tmp/{{ repo_name }}"

  tasks:
    - name: Ensure GitHub repository exists
      ansible.builtin.uri:
        url: "https://api.github.com/user/repos"
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          name: "{{ repo_name }}"
          description: "Automated repo created via Ansible Automation Platform"
          private: false
          auto_init: true
        status_code: [201, 422]
      no_log: true

    - name: Seed initial README via API if repository has no commits
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/contents/README.md"
        method: PUT
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          message: "Initial commit via GitHub API"
          content: "{{ '# ' ~ repo_name | b64encode }}"
        status_code: [201, 422]  # 201 if created now, 422 if README already exists
      no_log: true

    - name: Clean existing local temporary directory if present
      ansible.builtin.file:
        path: "{{ local_repo_path }}"
        state: absent

    - name: Retrieve Git repository into local directory
      ansible.scm.git_retrieve:
        origin:
          url: "https://github.com/{{ repo_owner }}/{{ repo_name }}.git"
          token: "{{ github_token }}"
        parent_directory: "/tmp"
      no_log: true

    - name: Configure local Git user name
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.name
        value: "AAP Automation Bot"
        scope: local

    - name: Configure local Git user email
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.email
        value: "aap-bot@example.com"
        scope: local

    - name: Append content to README file
      ansible.builtin.lineinfile:
        path: "{{ local_repo_path }}/README.md"
        line: "Managed by Ansible Automation Platform and ansible.scm."

    - name: Publish changes back to remote repository
      ansible.scm.git_publish:
        path: "{{ local_repo_path }}"
        token: "{{ github_token }}"
        username: "{{ github_user }}"
        message: "Update README via ansible.scm.git_publish"
      no_log: true