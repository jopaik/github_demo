---
- name: Provision GitHub Repository and Workspace via ansible.scm
  hosts: localhost
  gather_facts: false
  vars:
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    github_user: "{{ lookup('ansible.builtin.env', 'GITHUB_USER') | default('x-access-token', true) }}"
    org_name: "my-organization"
    repo_name: "aap-automation-demo"
    local_repo_path: "/tmp/{{ repo_name }}"

  tasks:
    - name: Ensure GitHub repository exists with proper settings
      community.general.github_repo:
        token: "{{ github_token }}"
        organization: "{{ org_name }}"
        name: "{{ repo_name }}"
        description: "Automated repo created via Ansible Automation Platform"
        private: false
        has_issues: true
        has_wiki: false
        topics:
          - ansible
          - automation
          - aap
        state: present
      no_log: false

    - name: Retrieve Git repository into local directory
      ansible.scm.git_retrieve:
        origin:
          url: "https://github.com/{{ org_name }}/{{ repo_name }}.git"
          token: "{{ github_token }}"
          username: "{{ github_user }}"
        parent_directory: "/tmp"
        name: "{{ repo_name }}"
      no_log: true

    - name: Configure local Git user name
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.name
        value: "AAP Automation Bot"
        scope: local

    - name: Configure local Git user email
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.email
        value: "aap-bot@example.com"
        scope: local

    - name: Create initial README file
      ansible.builtin.copy:
        dest: "{{ local_repo_path }}/README.md"
        content: |
          # AAP Automation Demo
          This repository was provisioned using Ansible Automation Platform and `ansible.scm`.
        mode: '0644'

    - name: Commit and publish changes to remote repository
      ansible.scm.git_publish:
        path: "{{ local_repo_path }}"
        token: "{{ github_token }}"
        username: "{{ github_user }}"
        message: "Initial commit via ansible.scm.git_publish"
      no_log: true