---
- name: Code Change and PR Automation
  hosts: localhost
  gather_facts: false
  vars:
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    repo_owner: "my-organization"
    repo_name: "aap-automation-demo"
    local_repo_path: "/tmp/{{ repo_name }}"
    feature_branch: "feature/add-readme-update"

  tasks:
    - name: Checkout feature branch
      ansible.scm.git:
        repo: "https://github.com/{{ repo_owner }}/{{ repo_name }}.git"
        dest: "{{ local_repo_path }}"
        version: "{{ feature_branch }}"
        update: true

    - name: Update README content
      ansible.builtin.lineinfile:
        path: "{{ local_repo_path }}/README.md"
        line: "Updated automatically by Ansible Automation Platform on {{ ansible_date_time.iso8601 | default('now') }}"
        create: true

    - name: Commit and push changes via Git
      ansible.builtin.shell: |
        git add README.md
        git commit -m "docs: automated update to README"
        git push origin {{ feature_branch }}
      args:
        chdir: "{{ local_repo_path }}"

    - name: Create Pull Request on GitHub
      community.general.github_pr:
        token: "{{ github_token }}"
        repo: "{{ repo_name }}"
        owner: "{{ repo_owner }}"
        title: "Automated PR: Updated README"
        body: "This PR was generated by an automated AAP Playbook."
        head: "{{ feature_branch }}"
        base: "main"
        state: present