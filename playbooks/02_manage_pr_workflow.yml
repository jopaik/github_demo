---
- name: Code Change and Pull Request Automation
  hosts: localhost
  gather_facts: true
  vars:
    github_token: "{{ lookup('ansible.builtin.env', 'GITHUB_TOKEN') }}"
    github_user: "{{ lookup('ansible.builtin.env', 'GITHUB_USER') | default('x-access-token', true) }}"
    repo_owner: "jopaik"
    repo_name: "aap-automation-github-demo"
    local_repo_path: "/tmp/{{ repo_name }}"
    feature_branch: "feature/automated-readme-update"

  tasks:
    - name: Clean stale local repository workspace if present
      ansible.builtin.file:
        path: "{{ local_repo_path }}"
        state: absent

    - name: Retrieve Git repository into local directory
      ansible.scm.git_retrieve:
        origin:
          url: "https://github.com/{{ repo_owner }}/{{ repo_name }}.git"
          token: "{{ github_token }}"
        parent_directory: "/tmp"
      no_log: true

    - name: Configure local Git user name
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.name
        value: "AAP Automation Bot"
        scope: local

    - name: Configure local Git user email
      community.general.git_config:
        repo: "{{ local_repo_path }}"
        name: user.email
        value: "aap-bot@example.com"
        scope: local

    - name: Create and checkout new feature branch
      ansible.builtin.command:
        cmd: "git checkout -b {{ feature_branch }}"
        chdir: "{{ local_repo_path }}"

    - name: Append automated update entry to README
      ansible.builtin.lineinfile:
        path: "{{ local_repo_path }}/README.md"
        line: "- Feature update applied by AAP on {{ ansible_date_time.iso8601 }}"
        create: true

    - name: Stage modified files
      ansible.builtin.command:
        cmd: git add README.md
        chdir: "{{ local_repo_path }}"

    - name: Commit changes to feature branch
      ansible.builtin.command:
        cmd: 'git commit -m "docs: automated README update from AAP"'
        chdir: "{{ local_repo_path }}"

    - name: Publish feature branch to GitHub via ansible.scm.git_publish
      ansible.scm.git_publish:
        path: "{{ local_repo_path }}"
        token: "{{ github_token }}"
        user:
          name: "AAP Automation Bot"
          email: "aap-bot@example.com"
      no_log: false

    - name: Create Pull Request via GitHub REST API
      ansible.builtin.uri:
        url: "https://api.github.com/repos/{{ repo_owner }}/{{ repo_name }}/pulls"
        method: POST
        headers:
          Authorization: "Bearer {{ github_token }}"
          Accept: "application/vnd.github+json"
        body_format: json
        body:
          title: "Automated PR: README Update"
          body: "This PR was generated automatically by Ansible Automation Platform using `ansible.scm`."
          head: "{{ feature_branch }}"
          base: "main"
        status_code: [201, 422]  # 201 = created, 422 = PR already exists for this branch
      register: pr_response
      no_log: true

    - name: Display Pull Request URL
      ansible.builtin.debug:
        msg: "Pull Request URL: {{ pr_response.json.html_url | default('PR already exists or was previously created') }}"